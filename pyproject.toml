[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "turboquant-vectors"
version = "0.1.0b1"
description = "Compress embeddings 8x instantly with TurboQuant. No training needed. Up to +8pp recall vs FAISS PQ at matched storage."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [{name = "back2matching"}]
keywords = ["embeddings", "vector-search", "compression", "quantization", "turboquant", "faiss", "rag", "numpy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24.0"]

[project.optional-dependencies]
faiss = ["faiss-cpu"]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/back2matching/turboquant-vectors"

[project.scripts]
tq-vectors = "turboquant_vectors.cli:main"

[tool.setuptools.packages.find]
include = ["turboquant_vectors*"]
